<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hive | Tabletop online</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=5" />
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="brand-lockup"><span class="brand-mark">H</span><div><p class="eyebrow">TABLETOP / TWO PLAYERS</p><h1>Hive</h1></div></div>
      <div class="turn-readout" id="turnReadout">White's turn -- Turn 1</div>
      <div class="action-menu" id="actionMenu"></div>
      <button class="reset-button" id="resetButton" type="button">New game</button>
    </header>
    <section class="play-layout">
      <aside class="side-panel white-panel"><div class="player-heading"><span class="player-dot white-dot"></span><span>White</span><strong id="whiteScore">0</strong></div><div class="hand" id="whiteHand"></div></aside>
      <section class="board-stage" aria-label="Hive board">
        <div class="board-toolbar"><div><span class="status-kicker">CURRENT TURN</span><strong id="statusText">Choose a piece from your hand</strong></div><div class="legend"><span class="legend-dot legal-dot"></span> legal destination</div></div>
        <div class="board-wrap"><canvas id="board" aria-label="Interactive Hive board"></canvas><div class="board-empty" id="boardEmpty">Start the hive<br /><span>Place your first piece at the center.</span></div></div>
        <p class="hint" id="hintText">Select a tile from the hand, then place it on a highlighted hex.</p>
      </section>
      <aside class="side-panel black-panel"><div class="player-heading"><span class="player-dot black-dot"></span><span>Black</span><strong id="blackScore">0</strong></div><div class="hand" id="blackHand"></div></aside>
    </section>
  </main>
  <audio id="placementSound" preload="auto" src="sounds/ElevenLabs_satisfying_card_flip_asmr.mp3"></audio>
  <script src="app.js?v=5" type="module"></script>
</body>
</html>
